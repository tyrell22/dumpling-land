<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6FD3C1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dumplings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Dumpling Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one full-screen toy box; each mode is a screen with a canvas stage and chunky touch controls. Single bright look on purpose. */
:root{
  --jade:#6FD3C1; --jade-deep:#2E9C8A; --bamboo:#F0BE6E; --lantern:#F2605A; --lantern-deep:#B83A35;
  --ink:#3D2B45; --cloud:#FFFDF8; --lilac:#B9A2FF;
  --font:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:radial-gradient(circle at 12% 0%,#A4EADD 0,transparent 45%),var(--jade);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--lantern);outline-offset:3px}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* bars */
.bar{display:flex;align-items:center;gap:14px;padding:12px 16px}
.bar h2{margin:0;font-size:clamp(24px,4vw,40px);font-weight:800;color:var(--cloud);text-shadow:0 3px 0 var(--jade-deep);line-height:1.1}
.grow{flex:1}
.back,.round{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--cloud);box-shadow:0 6px 0 rgba(0,0,0,.18);display:grid;place-items:center;font-size:32px;padding:0}
.back:active,.round:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.count{font-weight:800;font-size:clamp(20px,3vw,30px);background:var(--cloud);border-radius:999px;padding:2px 18px;box-shadow:0 5px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}

/* home */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;gap:12px}
.home-head h1{margin:0;font-size:clamp(36px,6.5vw,72px);font-weight:800;line-height:1;color:var(--cloud);text-shadow:0 4px 0 var(--jade-deep),0 8px 0 rgba(0,0,0,.08);letter-spacing:.5px}
.home-wrap{flex:1;display:grid;grid-template-columns:1fr 1.25fr;gap:20px;padding:6px 20px 20px;min-height:0}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0;background:radial-gradient(circle at 50% 55%,#E9FBF6 0 38%,rgba(233,251,246,0) 70%);border-radius:40px}
.hero canvas{flex:1;min-height:0}
.pill{border:0;border-radius:999px;background:var(--cloud);box-shadow:0 6px 0 rgba(0,0,0,.16);padding:8px 22px;font-weight:800;font-size:clamp(18px,2.4vw,26px);font-variant-numeric:tabular-nums;max-width:100%}
.pill:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.tile{border:0;border-radius:30px;font-weight:800;font-size:clamp(16px,2.1vw,26px);line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 9px 0 rgba(0,0,0,.2),inset 0 -6px 0 rgba(0,0,0,.06);position:relative;padding:10px;min-height:0;overflow:hidden;text-align:center}
.tile:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tile .ico{flex:1;width:100%;min-height:0}
.tile .emo{display:flex;align-items:center;justify-content:center;font-size:clamp(40px,6vw,84px);line-height:1}
.t-steam{background:#FFD98E}.t-dress{background:#DCCFFF}.t-feed{background:#FFC4D8}.t-adv{background:#AFE4FF}.t-bath{background:#BDEFF5}.t-house{background:#FFD3B8}.t-park{background:#C8F0A8}.t-shelf{background:#FFF0B3}
.home-actions{display:flex;gap:12px;align-items:center}
.moon{border:0;border-radius:999px;background:#2C2A5A;color:#FFF3C4;font-weight:800;font-size:clamp(18px,2.4vw,26px);padding:8px 20px 8px 14px;box-shadow:0 6px 0 #17153A;white-space:nowrap}
.moon:active{transform:translateY(4px);box-shadow:0 2px 0 #17153A}
.badge{position:absolute;top:10px;right:12px;background:var(--lantern);color:#fff;border-radius:999px;padding:0 12px;font-size:clamp(16px,2vw,22px);box-shadow:0 3px 0 var(--lantern-deep)}
@media (orientation:portrait){
  .home-wrap{grid-template-columns:1fr;grid-template-rows:.7fr 1.3fr}
  .tiles{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr)}
}

/* bath, house, bedtime */
.bath-stage{background-color:#DDF2FF;background-image:linear-gradient(rgba(255,255,255,.9) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.9) 3px,transparent 3px);background-size:56px 56px}
.tools{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;padding:0 16px;pointer-events:none}
.tools>*{pointer-events:auto}
.tool{width:84px;height:84px;border-radius:50%;border:5px solid transparent;background:var(--cloud);font-size:44px;box-shadow:0 7px 0 rgba(0,0,0,.18);display:grid;place-items:center;padding:0}
.tool.on{border-color:var(--lantern);background:#FFF1E6}
.tool.nudge{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-10px) scale(1.08)}}
.house-wrap{flex:1;display:flex;flex-direction:column;gap:14px;padding:0 16px 16px;min-height:0}
.house-wrap .stage{margin:0}
.tray{flex:none;display:flex;gap:10px;overflow-x:auto;background:var(--cloud);border-radius:28px;box-shadow:0 7px 0 rgba(0,0,0,.14);padding:10px 12px}
.tray button{flex:none;width:72px;height:72px;border-radius:20px;border:0;background:#FFF1E6;font-size:40px;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.tray button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.tray .paint{background:#E8DEFF}
.bed-stage{background:#1B1D4A}
.sleep{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#1E2358 0%,#0B0E28 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#FFF3C4;text-align:center}
.sleep .moon-big{font-size:clamp(90px,16vw,170px);line-height:1}
.sleep h3{margin:0;font-size:clamp(36px,6vw,64px);font-weight:800}
.wake{position:relative;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,243,196,.75);font-weight:600;font-size:18px;padding:12px 26px;overflow:hidden;margin-top:28px}
.wake i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,243,196,.28)}
.wake span{position:relative}

/* stages */
.stage{flex:1;position:relative;min-height:0;margin:0 16px 16px;border-radius:32px;overflow:hidden}
.st-stage{background:radial-gradient(ellipse at 50% 32%,#F2FFFB 0%,#C3EFE5 55%,#94DECE 100%)}
.feed-stage{background:radial-gradient(ellipse at 50% 35%,#FFF7FA 0%,#FFE0EA 60%,#FFC9DA 100%)}
.adv-stage{background:#8FDBFF}
.hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-weight:800;font-size:clamp(20px,3vw,30px);background:rgba(255,253,248,.85);border-radius:999px;padding:4px 20px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
.st-info{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--cloud);border-radius:999px;padding:6px 20px;box-shadow:0 6px 0 rgba(0,0,0,.14);white-space:nowrap;max-width:calc(100% - 32px)}
.st-name{font-size:clamp(22px,3.6vw,38px);font-weight:800;line-height:1.1}
.chip{border-radius:999px;padding:0 12px;font-weight:800;font-size:clamp(14px,2vw,20px);color:#fff;background:var(--lantern)}
.chip.rar{background:#D99A00}
.st-actions{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 16px}
.big{border:0;border-radius:999px;padding:10px 28px;font-weight:800;font-size:clamp(20px,3vw,30px);background:var(--lantern);color:#fff;box-shadow:0 7px 0 var(--lantern-deep)}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--lantern-deep)}
.big.alt{background:var(--cloud);color:var(--ink);box-shadow:0 7px 0 rgba(0,0,0,.18)}

/* shelf */
.shelf{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;padding:6px 16px 28px;align-content:start}
.slot{aspect-ratio:.85;border:0;border-radius:26px;background:var(--cloud);box-shadow:0 7px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;padding:8px 6px 10px;font-weight:800;font-size:clamp(14px,1.8vw,18px);line-height:1.1;position:relative;text-align:center}
.slot canvas{flex:1;min-height:0}
.slot.locked{background:#CDEDE6;box-shadow:0 7px 0 rgba(0,0,0,.08)}
.slot.on{outline:6px solid var(--lantern);outline-offset:-2px}
.slot .rar{position:absolute;top:8px;right:10px;color:#D99A00;font-style:normal;font-size:18px}
.slot.bounce{animation:bounce .4s ease}
@keyframes bounce{40%{transform:scale(1.08)}}

/* dress */
.dress-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px 16px;min-height:0}
.stage-card{background:radial-gradient(circle at 50% 50%,#FFFDF8 0 32%,#E3E9FF 75%);border-radius:32px;position:relative;min-height:0;overflow:hidden}
.panel{background:var(--cloud);border-radius:32px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.tabs{display:flex;gap:10px}
.tab{flex:1;font-size:clamp(28px,4vw,42px);border-radius:22px;border:0;background:#F0EAF8;padding:4px 0;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.tab.on{background:var(--lilac);box-shadow:0 5px 0 #8C70E8}
.opts{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;align-content:start;padding:4px}
.opt{aspect-ratio:1;border-radius:24px;border:5px solid transparent;background:#F6F1FA;padding:0}
.opt.on{border-color:var(--lantern);background:#FFF1E6}
@media (orientation:portrait){
  .dress-wrap{grid-template-columns:1fr;grid-template-rows:1fr minmax(0,46%)}
}

/* adventure overlays */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow-y:auto}
.pick-q{margin:0;font-size:clamp(26px,4.5vw,48px);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);text-align:center}
.worlds{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:760px}
.world{flex:1 1 170px;max-width:220px;aspect-ratio:1.15;border:6px solid #fff;border-radius:34px;font-weight:800;font-size:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 9px 0 rgba(0,0,0,.2)}
.world:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.world .emo{font-size:clamp(48px,7vw,84px);line-height:1.1}
@media (orientation:portrait){.world{aspect-ratio:auto;flex-basis:40%;max-width:300px;padding:10px}}
.card{background:var(--cloud);border-radius:34px;padding:22px 28px 28px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.18);max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.hooray{font-size:clamp(40px,7vw,72px);font-weight:800;color:var(--lantern);line-height:1}
.endscore{font-size:clamp(28px,4vw,40px);font-weight:800;font-variant-numeric:tabular-nums}
.reward{display:flex;align-items:center;gap:12px;font-weight:800;font-size:clamp(18px,2.6vw,24px);background:#FFF5D6;border-radius:24px;padding:8px 18px 8px 8px}
.reward canvas{width:110px;height:80px;flex:none}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.slot.bounce{animation:none}.tool.nudge{animation:none}}
</style>


</head>
<body>

<script>
(()=>{
const $=s=>document.querySelector(s);
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT='"Baloo 2","Trebuchet MS",sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const blinkAt=t=>(t%4.2)<.13;
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

/* ---------- data ---------- */
const COLORS={cream:'#FFF0D2',peach:'#FFC9A3',pink:'#FFC2D6',mint:'#BDEFD2',sky:'#BCDFFF',lilac:'#D7C8FF',lemon:'#FFE47A',matcha:'#C9E39A',choco:'#C99878',snow:'#FFFFFF',butter:'#FFE27A',cocoa:'#B07650',cheese:'#FFD24A',toast:'#F6D59C',dough:'#E8B07A',custard:'#FFE7A8'};
const ROSTER=[
 {id:'bao',name:'Bao',color:'cream',ears:'none',pat:'plain',rar:0},
 {id:'peachy',name:'Peachy',color:'peach',ears:'none',pat:'plain',rar:0},
 {id:'kitty',name:'Mochi Kitty',color:'pink',ears:'cat',pat:'plain',rar:0},
 {id:'minty',name:'Minty Bear',color:'mint',ears:'bear',pat:'plain',rar:0},
 {id:'hoppy',name:'Hoppy',color:'sky',ears:'bunny',pat:'plain',rar:0},
 {id:'sprout',name:'Sprouty',color:'cream',ears:'sprout',pat:'plain',rar:0},
 {id:'froggy',name:'Froggy',color:'matcha',ears:'frog',pat:'plain',rar:0},
 {id:'lilac',name:'Lilac Kitty',color:'lilac',ears:'cat',pat:'plain',rar:0},
 {id:'sunny',name:'Sunny Bear',color:'lemon',ears:'bear',pat:'plain',rar:0},
 {id:'choco',name:'Choco Bunny',color:'choco',ears:'bunny',pat:'plain',rar:0},
 {id:'berry',name:'Berry',color:'pink',ears:'none',pat:'spots',rar:0},
 {id:'snowy',name:'Snowy Bear',color:'snow',ears:'bear',pat:'plain',rar:0},
 {id:'twinkle',name:'Twinkle Kitty',color:'lilac',ears:'cat',pat:'sparkle',rar:1},
 {id:'starry',name:'Starry Bunny',color:'sky',ears:'bunny',pat:'sparkle',rar:1},
 {id:'rainbow',name:'Rainbow Bao',color:'snow',ears:'none',pat:'rainbow',rar:1},
 {id:'rainbear',name:'Rainbow Bear',color:'snow',ears:'bear',pat:'rainbow',rar:1},
 {id:'goldie',name:'Golden Bao',color:'lemon',ears:'none',pat:'gold',rar:2},
 {id:'goldbun',name:'Golden Bunny',color:'lemon',ears:'bunny',pat:'gold',rar:2},
 {id:'butter',name:'Butter Pat',color:'butter',ears:'none',pat:'plain',rar:0,shape:'butter'},
 {id:'chocbar',name:'Choco Block',color:'cocoa',ears:'none',pat:'plain',rar:0,shape:'chocbar'},
 {id:'cheese',name:'Cheesy',color:'cheese',ears:'none',pat:'plain',rar:0,shape:'cheese'},
 {id:'toast',name:'Toasty',color:'toast',ears:'none',pat:'plain',rar:0,shape:'toast'},
 {id:'donut',name:'Sprinkles',color:'dough',ears:'none',pat:'plain',rar:0,shape:'donut'},
 {id:'pudding',name:'Pudding',color:'custard',ears:'none',pat:'plain',rar:0,shape:'pudding'},
 {id:'sbutter',name:'Sparkle Butter',color:'butter',ears:'none',pat:'sparkle',rar:1,shape:'butter'},
 {id:'rtoast',name:'Rainbow Toast',color:'snow',ears:'none',pat:'rainbow',rar:1,shape:'toast'},
 {id:'gcheese',name:'Golden Cheese',color:'cheese',ears:'none',pat:'gold',rar:2,shape:'cheese'}
];
const RID=Object.fromEntries(ROSTER.map(d=>[d.id,d]));
const HATS=['none','bow','crown','party','chef','flower','beanie','tophat','headphones'];
const GLASSES=['none','round','sun','heart','star'];
const FACES=['smile','cat','blep','wink','star','sleepy'];
const FOODS=['🍓','🍎','🍌','🥕','🍪','🧁','🍉','🥦','🍇','🍩'];
const CONF=['#FF5C8A','#FFD13B','#4FC3F7','#7BD88F','#B99BFF','#FF9F5A'];
const WORLDS={
 garden:{name:'Flower Garden',icon:'🌷',sky:['#8FDBFF','#E3F9FF'],far:'#A3DE90',near:'#62C26F',ground:'#4BA25C',goods:['⭐','⭐','🍓','🌼'],bads:['🐝','🌵'],deco:['🌷','🌼','🍄'],goal:'🏡',bub:false},
 sea:{name:'Bubble Sea',icon:'🐠',sky:['#2FA8D6','#9AE3F2'],far:'#4CC2C9',near:'#2C93A8',ground:'#F2D49C',goods:['⭐','⭐','🐚','💎'],bads:['🦀','🪼','🐡'],deco:['🪸','🐚','🌿'],goal:'🏝️',bub:true},
 jungle:{name:'Jungle',icon:'🌴',sky:['#7FD6A8','#E2F8EA'],far:'#3FA866',near:'#2E8B57',ground:'#6B4A2B',goods:['⭐','⭐','🍌','🥥'],bads:['🐍','🐊'],deco:['🌴','🌿','🍄'],goal:'🛖',bub:false},
 snow:{name:'Snowy Hills',icon:'⛄',mode:'jump',sky:['#A9DBFF','#F2FAFF'],far:'#FFFFFF',near:'#E6F2FF',ground:'#FFFFFF',goods:['⭐','⭐','❄️','🍪'],bads:['⛄','🪨'],deco:['🌲','🌲','🎄'],goal:'🏠',bub:false,snow:true},
 space:{name:'Star Catch',icon:'🚀',mode:'catch',sky:['#0E0B2E','#2C2066'],goods:['⭐','⭐','🌟','🪐'],bads:['☄️'],deco:[],goal:'🚀',space:true},
 candy:{name:'Candy Hills',icon:'🍭',sky:['#FFB3DD','#FFEAF6'],far:'#C9A4FF',near:'#FF8DC4',ground:'#FFF4FA',goods:['⭐','⭐','🍬','🍒'],bads:['🌶️','⛈️'],deco:['🧁','🍩','🎂'],goal:'🏰',bub:false}
};

/* ---------- save ---------- */
let S={found:['bao'],active:'bao',outfits:{},golden:0,muted:false,house:[],wall:0};
try{const raw=localStorage.getItem('dumpling-land');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
S.found=[...new Set(S.found.filter(id=>RID[id]))];if(!S.found.length)S.found=['bao'];if(!RID[S.active])S.active='bao';
function save(){try{localStorage.setItem('dumpling-land',JSON.stringify(S))}catch(e){}}
function outfit(id){return S.outfits[id]||(S.outfits[id]={color:null,hat:'none',glasses:'none',face:'smile'})}
function lookOf(id){const d=RID[id],o=outfit(id);return{color:COLORS[o.color||d.color],ears:d.ears,pat:d.pat,shape:d.shape||'dumpling',hat:o.hat,glasses:o.glasses,face:o.face}}
function baseLook(d){return{color:COLORS[d.color],ears:d.ears,pat:d.pat,shape:d.shape||'dumpling',hat:'none',glasses:'none',face:'smile'}}

/* ---------- sound ---------- */
let AC=null;
function ac(){if(S.muted)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(f,d,{type='sine',vol=.18,to=null,delay=0}={}){const a=ac();if(!a)return;const t0=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
const SFX={
 pop:()=>tone(500,.14,{type:'triangle',to:1100,vol:.14}),
 squish:()=>{tone(260,.32,{to:110,vol:.22});tone(520,.12,{type:'triangle',to:300,vol:.05})},
 boing:()=>tone(180,.32,{to:440,vol:.2}),
 chomp:()=>{tone(170,.07,{type:'square',vol:.07});tone(140,.07,{type:'square',vol:.07,delay:.11})},
 nope:()=>{tone(330,.15,{type:'triangle',vol:.12});tone(262,.2,{type:'triangle',vol:.12,delay:.16})},
 coin:(n=0)=>{const b=880*Math.pow(1.06,Math.min(n,12));tone(b,.08,{type:'square',vol:.05});tone(b*1.5,.14,{type:'square',vol:.05,delay:.07})},
 bump:()=>tone(170,.32,{type:'sawtooth',to:60,vol:.07}),
 sparkle:()=>[1319,1568,2093].forEach((f,i)=>tone(f,.15,{type:'triangle',vol:.07,delay:i*.06})),
 yay:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.12,delay:i*.11})),
 whoosh:()=>tone(300,.4,{to:1200,vol:.07})
};

/* ---------- voice (pre-recorded clips, one voice per dumpling) ---------- */
const VOICE_RATE={bao:1.1,peachy:1.12,kitty:1.16,minty:1.2,hoppy:1.12,sprout:1.1,froggy:1.26,lilac:1.12,sunny:1.22,choco:1.12,berry:1.13,snowy:1.26,twinkle:1.15,starry:1.12,rainbow:1.1,rainbear:1.2,goldie:1.2,goldbun:1.12};
const CLIPS={},BUF={};let curSrc=null,voiceTok=0;
function loadVoice(id){const get=d=>fetch(`${d}/${id}.json`).then(r=>r.ok?r.json():Promise.reject());return CLIPS[id]||(CLIPS[id]=get('voices3').catch(()=>get('voices2')).catch(()=>get('voices')).catch(()=>null))}
async function getBuf(id,k,data){const key=id+':'+k;if(BUF[key])return BUF[key];const b64=data[k];if(!b64)return null;const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));try{BUF[key]=await new Promise((res,rej)=>ac().decodeAudioData(bin.buffer,res,rej))}catch(e){return null}return BUF[key]}
function hush(){voiceTok++;if(curSrc){try{curSrc.stop()}catch(e){}curSrc=null}}
async function talk(keys,id=S.active){if(S.muted)return;const a=ac();if(!a)return;keys=[].concat(keys);hush();const tok=voiceTok;
 const data=await loadVoice(id);if(!data||tok!==voiceTok)return;
 for(const k of keys){const b=await getBuf(id,k,data);if(!b||tok!==voiceTok)return;
  await new Promise(res=>{const src=a.createBufferSource(),g=a.createGain();src.buffer=b;g.gain.value=1.3;src.connect(g).connect(a.destination);src.onended=res;curSrc=src;src.start()});if(tok!==voiceTok)return}}
const wantKey=f=>'want_'+FOODS.indexOf(f);

/* ---------- drawing helpers ---------- */
function hexRgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function mix(h,amt){const c=hexRgb(h),t=amt>0?255:0,a=Math.abs(amt);return`rgb(${c.map(v=>Math.round(v+(t-v)*a)).join(',')})`}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function starPath(ctx,x,y,r,n=5,inner=.5){ctx.beginPath();for(let i=0;i<n*2;i++){const rr2=i%2?r*inner:r,a=-Math.PI/2+i*Math.PI/n;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}ctx.closePath()}
function heartPath(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s*.9,y-s*.2,x-s*.45,y-s*.85,x,y-s*.35);ctx.bezierCurveTo(x+s*.45,y-s*.85,x+s*.9,y-s*.2,x,y+s*.35);ctx.closePath()}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function emoji(ctx,e,x,y,size){ctx.fillStyle='#000';ctx.font=`${size}px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y)}
function fit(cv){const r=cv.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);return{ctx,w:r.width,h:r.height}}
function ptr(cv,e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

/* ---------- the dumpling ---------- */
function bodyPath(ctx,cx,cy,r,shape='dumpling'){const by=cy+.68*r;ctx.beginPath();
 if(shape==='butter'){rr(ctx,cx-1.1*r,cy-.55*r,2.2*r,1.23*r,.22*r);return}
 if(shape==='chocbar'){rr(ctx,cx-1.0*r,cy-.78*r,2.0*r,1.46*r,.16*r);return}
 if(shape==='cheese'){ctx.moveTo(cx-1.1*r,by);ctx.lineTo(cx+1.1*r,by);ctx.lineTo(cx+1.1*r,cy-.18*r);ctx.quadraticCurveTo(cx+1.1*r,cy-.3*r,cx+.95*r,cy-.33*r);ctx.lineTo(cx-1.0*r,cy-.8*r);ctx.quadraticCurveTo(cx-1.1*r,cy-.82*r,cx-1.1*r,cy-.7*r);ctx.closePath();return}
 if(shape==='toast'){ctx.moveTo(cx-.92*r,by-.12*r);ctx.lineTo(cx-.92*r,cy-.4*r);ctx.bezierCurveTo(cx-1.3*r,cy-1.0*r,cx-.3*r,cy-1.08*r,cx,cy-.86*r);ctx.bezierCurveTo(cx+.3*r,cy-1.08*r,cx+1.3*r,cy-1.0*r,cx+.92*r,cy-.4*r);ctx.lineTo(cx+.92*r,by-.12*r);ctx.quadraticCurveTo(cx+.92*r,by,cx+.8*r,by);ctx.lineTo(cx-.8*r,by);ctx.quadraticCurveTo(cx-.92*r,by,cx-.92*r,by-.12*r);ctx.closePath();return}
 if(shape==='donut'){ctx.ellipse(cx,cy+.08*r,1.12*r,.62*r,0,0,Math.PI*2);return}
 if(shape==='pudding'){ctx.moveTo(cx-1.02*r,by-.08*r);ctx.quadraticCurveTo(cx-1.05*r,by,cx-.9*r,by);ctx.lineTo(cx+.9*r,by);ctx.quadraticCurveTo(cx+1.05*r,by,cx+1.02*r,by-.08*r);ctx.lineTo(cx+.72*r,cy-.55*r);ctx.quadraticCurveTo(cx,cy-.78*r,cx-.72*r,cy-.55*r);ctx.closePath();return}
 ctx.moveTo(cx-1.05*r,cy+.45*r);ctx.bezierCurveTo(cx-1.15*r,cy-.35*r,cx-.6*r,cy-.95*r,cx,cy-.95*r);ctx.bezierCurveTo(cx+.6*r,cy-.95*r,cx+1.15*r,cy-.35*r,cx+1.05*r,cy+.45*r);ctx.quadraticCurveTo(cx+1.02*r,cy+.68*r,cx+.72*r,cy+.68*r);ctx.lineTo(cx-.72*r,cy+.68*r);ctx.quadraticCurveTo(cx-1.02*r,cy+.68*r,cx-1.05*r,cy+.45*r);ctx.closePath()}
const HAT_TOP={dumpling:-.9,butter:-.55,chocbar:-.78,cheese:-.52,toast:-.86,donut:-.52,pudding:-.95};
function shapeDeco(ctx,shape,cx,cy,r,base){const by=cy+.68*r;
 if(shape==='butter'){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(cx-1.2*r,cy-.6*r,2.4*r,.2*r);
  ctx.fillStyle='#FFFFFF';ctx.fillRect(cx-1.2*r,cy-.7*r,.58*r,1.5*r);ctx.fillStyle='#7CB8FF';ctx.fillRect(cx-1.2*r,cy-.25*r,.58*r,.07*r);ctx.fillRect(cx-1.2*r,cy-.1*r,.58*r,.03*r);
  ctx.strokeStyle='rgba(61,43,69,.18)';ctx.lineWidth=.04*r;ctx.beginPath();ctx.moveTo(cx-.62*r,cy-.6*r);ctx.lineTo(cx-.66*r,by+.05*r);ctx.stroke()}
 if(shape==='chocbar'){ctx.strokeStyle='rgba(40,20,10,.35)';ctx.lineWidth=.05*r;ctx.beginPath();for(const x of[-.34,.34]){ctx.moveTo(cx+x*r,cy-.8*r);ctx.lineTo(cx+x*r,by)}ctx.moveTo(cx-1.1*r,cy-.18*r);ctx.lineTo(cx+1.1*r,cy-.18*r);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();for(const x of[-.3,.38]){ctx.moveTo(cx+x*r,cy-.8*r);ctx.lineTo(cx+x*r,by)}ctx.stroke();
  ctx.fillStyle='#E8504F';ctx.fillRect(cx-1.1*r,by-.3*r,2.2*r,.35*r);ctx.fillStyle='#D9DCE6';ctx.fillRect(cx-1.1*r,by-.34*r,2.2*r,.06*r)}
 if(shape==='cheese'){ctx.fillStyle=mix(base,-.15);for(const[a,b,k]of[[-.8,-.35,.12],[.75,.1,.14],[-.75,.35,.1],[.55,.5,.08],[.2,-.4,.07],[-.15,.55,.07]]){circle(ctx,cx+a*r,cy+b*r,k*r);ctx.fill()}}
 if(shape==='toast'){bodyPath(ctx,cx,cy,r,'toast');ctx.strokeStyle='#C98A4B';ctx.lineWidth=.28*r;ctx.stroke()}
 if(shape==='donut'){ctx.fillStyle='#FF9EC0';ctx.beginPath();ctx.ellipse(cx,cy-.05*r,1.0*r,.5*r,0,0,Math.PI*2);ctx.fill();for(const[a,k]of[[-.7,.16],[-.25,.2],[.3,.15],[.72,.18]]){circle(ctx,cx+a*r,cy+.38*r,k*r);ctx.fill()}
  ctx.fillStyle=mix(base,-.25);ctx.beginPath();ctx.ellipse(cx,cy-.33*r,.22*r,.08*r,0,0,Math.PI*2);ctx.fill();
  const sp=['#FFE066','#4FC3F7','#7BD88F','#FFFFFF','#B99BFF'];[[-.7,-.15,.4],[-.45,-.4,1.2],[.5,-.38,.2],[.75,-.05,1.5],[-.85,.15,2.4],[.6,.25,.9],[-.3,.38,2]].forEach(([a,b,rot],i)=>{ctx.save();ctx.translate(cx+a*r,cy+b*r);ctx.rotate(rot);ctx.fillStyle=sp[i%sp.length];rr(ctx,-.07*r,-.022*r,.14*r,.044*r,.02*r);ctx.fill();ctx.restore()})}
 if(shape==='pudding'){ctx.fillStyle='#B5651D';ctx.beginPath();ctx.moveTo(cx-1.1*r,cy-.9*r);ctx.lineTo(cx+1.1*r,cy-.9*r);ctx.lineTo(cx+1.1*r,cy-.42*r);for(const[a,d]of[[.6,.2],[.2,.05],[-.25,.25],[-.6,.08]]){ctx.quadraticCurveTo(cx+(a+.15)*r,cy-.42*r,cx+a*r,cy-(.38-d)*r);ctx.quadraticCurveTo(cx+(a-.1)*r,cy-.42*r,cx+(a-.2)*r,cy-.42*r)}ctx.lineTo(cx-1.1*r,cy-.42*r);ctx.closePath();ctx.fill()}}
function shapeTopDeco(ctx,shape,cx,cy,r){if(shape==='pudding'){ctx.strokeStyle='#4E9A3C';ctx.lineWidth=.04*r;ctx.beginPath();ctx.moveTo(cx,cy-.85*r);ctx.quadraticCurveTo(cx+.05*r,cy-1.05*r,cx+.15*r,cy-1.12*r);ctx.stroke();circle(ctx,cx,cy-.8*r,.15*r);ctx.fillStyle='#E8334A';ctx.fill();circle(ctx,cx-.05*r,cy-.85*r,.04*r);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill()}}
const SPARK=[[-.55,-.2],[.4,-.45],[.65,.25],[-.2,.45],[.1,-.7],[-.75,.3],[.8,-.1]];
function drawDumpling(ctx,cx,cy,r,L,st={}){
 const t=st.t??performance.now()/1000,sx=st.sx??1,sy=st.sy??1,rot=st.rot??0,sil=!!st.sil;
 const by=cy+.68*r,gold=L.pat==='gold',base=gold?'#F9CF4A':L.color,line=mix(base,-.5),shape=L.shape||'dumpling',dump=shape==='dumpling';
 const fillC=sil?'rgba(61,43,69,.28)':base;
 ctx.save();
 if(!st.noShadow){ctx.fillStyle='rgba(40,20,50,.16)';ctx.beginPath();ctx.ellipse(cx,by+.04*r,.95*r*sx,.12*r,0,0,Math.PI*2);ctx.fill()}
 ctx.translate(cx,by);ctx.rotate(rot);ctx.scale(sx,sy);ctx.translate(-cx,-by);
 ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=.06*r;ctx.strokeStyle=line;
 const inner='#FFB3C4';
 const earFill=()=>{ctx.fillStyle=fillC;ctx.fill();if(!sil)ctx.stroke()};
 if(dump&&L.ears==='cat')for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(cx+s*.82*r,cy-.38*r);ctx.lineTo(cx+s*.7*r,cy-1.08*r);ctx.lineTo(cx+s*.22*r,cy-.84*r);ctx.closePath();earFill();if(!sil){ctx.beginPath();ctx.moveTo(cx+s*.7*r,cy-.58*r);ctx.lineTo(cx+s*.66*r,cy-.93*r);ctx.lineTo(cx+s*.42*r,cy-.8*r);ctx.closePath();ctx.fillStyle=inner;ctx.fill()}}
 if(dump&&L.ears==='bear')for(const s of[-1,1]){circle(ctx,cx+s*.62*r,cy-.74*r,.27*r);earFill();if(!sil){circle(ctx,cx+s*.62*r,cy-.74*r,.14*r);ctx.fillStyle=inner;ctx.fill()}}
 if(dump&&L.ears==='bunny')for(const s of[-1,1]){ctx.save();ctx.translate(cx+s*.34*r,cy-1.2*r);ctx.rotate(s*.18);ctx.beginPath();ctx.ellipse(0,0,.18*r,.46*r,0,0,Math.PI*2);earFill();if(!sil){ctx.beginPath();ctx.ellipse(0,.05*r,.08*r,.32*r,0,0,Math.PI*2);ctx.fillStyle=inner;ctx.fill()}ctx.restore()}
 if(dump&&L.ears==='frog')for(const s of[-1,1]){circle(ctx,cx+s*.45*r,cy-.8*r,.26*r);earFill();if(!sil){circle(ctx,cx+s*.45*r,cy-.83*r,.13*r);ctx.fillStyle='#fff';ctx.fill();circle(ctx,cx+s*.45*r,cy-.81*r,.07*r);ctx.fillStyle='#3D2B45';ctx.fill()}}
 // body
 bodyPath(ctx,cx,cy,r,shape);
 if(sil){ctx.fillStyle=fillC;ctx.fill()}
 else{
  const g=ctx.createRadialGradient(cx-.35*r,cy-.45*r,.05*r,cx,cy,1.3*r);
  if(gold){g.addColorStop(0,'#FFF6C2');g.addColorStop(.5,'#F9CF4A');g.addColorStop(1,'#D69A12')}
  else{g.addColorStop(0,mix(base,.55));g.addColorStop(.55,base);g.addColorStop(1,mix(base,-.14))}
  ctx.fillStyle=g;ctx.fill();
  ctx.save();bodyPath(ctx,cx,cy,r,shape);ctx.clip();shapeDeco(ctx,shape,cx,cy,r,base);
  if(L.pat==='rainbow'){const lg=ctx.createLinearGradient(cx-r,0,cx+r,0);['#FF8A8A','#FFC36B','#FFF07A','#8EE59A','#7CC8FF','#B99BFF'].forEach((c,i,a)=>lg.addColorStop(i/(a.length-1),c));ctx.globalAlpha=.6;ctx.fillStyle=lg;ctx.fillRect(cx-1.2*r,cy-1.1*r,2.4*r,1.9*r);ctx.globalAlpha=1}
  if(L.pat==='spots'){ctx.fillStyle='rgba(255,110,155,.45)';for(const[a,b,s]of[[-.5,-.3,.13],[.35,-.5,.1],[.6,.1,.14],[-.75,.3,.1],[.1,.48,.11]]){circle(ctx,cx+a*r,cy+b*r,s*r);ctx.fill()}}
  if(L.pat==='sparkle'||gold||L.pat==='rainbow')SPARK.forEach(([a,b],i)=>{const tw=.5+.5*Math.sin(t*3+i*1.7);ctx.fillStyle=`rgba(255,255,255,${.35+.65*tw})`;starPath(ctx,cx+a*r,cy+b*r,(.05+.05*tw)*r,4,.35);ctx.fill()});
  const bg=ctx.createLinearGradient(0,cy+.2*r,0,by);bg.addColorStop(0,'rgba(80,40,60,0)');bg.addColorStop(1,'rgba(80,40,60,.13)');ctx.fillStyle=bg;ctx.fillRect(cx-1.2*r,cy+.2*r,2.4*r,.5*r);
  ctx.restore();
  bodyPath(ctx,cx,cy,r,shape);ctx.lineWidth=.06*r;ctx.strokeStyle=line;ctx.stroke();
  if(dump){ctx.strokeStyle=mix(base,-.35);ctx.globalAlpha=.55;ctx.lineWidth=.045*r;
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(cx,cy-.86*r);ctx.quadraticCurveTo(cx+i*.1*r,cy-.7*r,cx+i*.24*r,cy-.56*r+Math.abs(i)*.07*r);ctx.stroke()}
  ctx.globalAlpha=1;
  ctx.fillStyle=gold?'#FFF0A0':mix(base,.35);ctx.beginPath();ctx.ellipse(cx,cy-.9*r,.13*r,.08*r,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=line;ctx.lineWidth=.04*r;ctx.stroke()}
  shapeTopDeco(ctx,shape,cx,cy,r);
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.ellipse(cx-.55*r,cy-.42*r,.15*r,.08*r,-.7,0,Math.PI*2);ctx.fill();
 }
 if(dump&&L.ears==='sprout'){ctx.strokeStyle=sil?fillC:'#4E9A3C';ctx.lineWidth=.06*r;ctx.beginPath();ctx.moveTo(cx,cy-.92*r);ctx.quadraticCurveTo(cx+.05*r,cy-1.15*r,cx,cy-1.3*r);ctx.stroke();for(const s of[-1,1]){ctx.save();ctx.translate(cx+s*.17*r,cy-1.33*r);ctx.rotate(s*.45);ctx.beginPath();ctx.ellipse(0,0,.2*r,.1*r,0,0,Math.PI*2);ctx.fillStyle=sil?fillC:'#7CCB5B';ctx.fill();if(!sil){ctx.strokeStyle='#4E9A3C';ctx.lineWidth=.035*r;ctx.stroke()}ctx.restore()}}
 if(sil){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`800 ${r*.8}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',cx,cy+.05*r);ctx.restore();return}
 // face
 const ex=.36*r,ey=cy+.02*r;
 let eyes=st.eyes||({star:'star',wink:'wink',sleepy:'closed'}[L.face])||'open';
 if(st.blink&&eyes==='open')eyes='closed';
 ctx.fillStyle='#3D2B45';ctx.strokeStyle='#3D2B45';ctx.lineWidth=.055*r;
 for(const s of[-1,1]){const x=cx+s*ex;let e=eyes;if(eyes==='wink')e=s<0?'open':'happy';
  if(e==='open'){ctx.beginPath();ctx.ellipse(x,ey,.095*r,.11*r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';circle(ctx,x-.03*r,ey-.04*r,.035*r);ctx.fill();ctx.fillStyle='#3D2B45'}
  else if(e==='happy'){ctx.beginPath();ctx.arc(x,ey+.05*r,.09*r,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}
  else if(e==='closed'){ctx.beginPath();ctx.arc(x,ey-.02*r,.08*r,Math.PI*.15,Math.PI*.85);ctx.stroke()}
  else if(e==='dizzy'){const d=.07*r;ctx.beginPath();ctx.moveTo(x-d,ey-d);ctx.lineTo(x+d,ey+d);ctx.moveTo(x+d,ey-d);ctx.lineTo(x-d,ey+d);ctx.stroke()}
  else if(e==='star'){ctx.fillStyle='#FFD43B';starPath(ctx,x,ey,.14*r,5,.48);ctx.fill();ctx.lineWidth=.03*r;ctx.stroke();ctx.lineWidth=.055*r;ctx.fillStyle='#3D2B45'}
  else if(e==='heart'){ctx.fillStyle='#FF4F7B';heartPath(ctx,x,ey,.22*r);ctx.fill();ctx.fillStyle='#3D2B45'}
 }
 ctx.fillStyle='rgba(255,120,150,.5)';for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(cx+s*.62*r,cy+.18*r,.13*r,.075*r,0,0,Math.PI*2);ctx.fill()}
 const m=st.mouth||0,my=cy+.2*r;
 if(m>.05){ctx.beginPath();ctx.ellipse(cx,my+.02*r,.12*r+.05*r*m,.03*r+.17*r*m,0,0,Math.PI*2);ctx.fillStyle='#6B2E45';ctx.fill();ctx.save();ctx.clip();ctx.fillStyle='#FF8FA8';ctx.beginPath();ctx.ellipse(cx,my+.1*r+.12*r*m,.12*r,.08*r+.04*r*m,0,0,Math.PI*2);ctx.fill();ctx.restore()}
 else{ctx.lineWidth=.045*r;ctx.strokeStyle='#3D2B45';ctx.beginPath();
  if(L.face==='cat'){ctx.arc(cx-.06*r,my,.06*r,0,Math.PI);ctx.moveTo(cx+.12*r,my);ctx.arc(cx+.06*r,my,.06*r,0,Math.PI)}
  else ctx.arc(cx,my-.04*r,.09*r,Math.PI*.15,Math.PI*.85);
  ctx.stroke();
  if(L.face==='blep'){ctx.fillStyle='#FF8FA8';ctx.beginPath();ctx.ellipse(cx+.02*r,my+.07*r,.05*r,.06*r,0,0,Math.PI*2);ctx.fill()}}
 drawGlasses(ctx,cx,ey,r,L.glasses);
 ctx.translate(0,((HAT_TOP[shape]??-.9)+.9)*r);drawHat(ctx,cx,cy,r,L.hat);
 ctx.restore();
}
function drawGlasses(ctx,cx,ey,r,g){
 if(!g||g==='none')return;
 ctx.save();ctx.lineWidth=.045*r;ctx.strokeStyle='#3D2B45';const ex=.36*r;
 if(g==='round'){for(const s of[-1,1]){circle(ctx,cx+s*ex,ey,.18*r);ctx.fillStyle='rgba(200,235,255,.35)';ctx.fill();ctx.stroke()}ctx.beginPath();ctx.moveTo(cx-ex+.18*r,ey);ctx.quadraticCurveTo(cx,ey-.06*r,cx+ex-.18*r,ey);ctx.stroke()}
 if(g==='sun'){for(const s of[-1,1]){rr(ctx,cx+s*ex-.2*r,ey-.13*r,.4*r,.26*r,.1*r);ctx.fillStyle='#2B2140';ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(cx+s*ex-.07*r,ey-.05*r,.06*r,.03*r,-.4,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.moveTo(cx-ex+.2*r,ey-.04*r);ctx.lineTo(cx+ex-.2*r,ey-.04*r);ctx.stroke()}
 if(g==='heart'){for(const s of[-1,1]){heartPath(ctx,cx+s*ex,ey+.03*r,.44*r);ctx.fillStyle='rgba(255,90,140,.55)';ctx.fill();ctx.strokeStyle='#E8336B';ctx.stroke()}}
 if(g==='star'){for(const s of[-1,1]){starPath(ctx,cx+s*ex,ey,.24*r,5,.55);ctx.fillStyle='rgba(255,215,60,.6)';ctx.fill();ctx.strokeStyle='#D99A00';ctx.stroke()}}
 ctx.restore();
}
function drawHat(ctx,cx,cy,r,h){
 if(!h||h==='none')return;
 const top=cy-.9*r;ctx.save();ctx.lineWidth=.045*r;ctx.strokeStyle='#3D2B45';ctx.lineJoin='round';
 if(h==='bow'){const x=cx+.48*r,y=cy-.72*r;ctx.fillStyle='#FF5C8A';for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s*.3*r,y-.17*r);ctx.lineTo(x+s*.3*r,y+.17*r);ctx.closePath();ctx.fill();ctx.stroke()}circle(ctx,x,y,.08*r);ctx.fillStyle='#FF9FBD';ctx.fill();ctx.stroke()}

/* ---------- bamboo steamer ---------- */
function steamerCols(gold){return gold?{b:'#FFD45E',d:'#B88A0E',band:'#E8B425',inside:'#7A5000'}:{b:'#EDBE72',d:'#A9722E',band:'#C9934A',inside:'#6E4518'}}

 const shape=()=>{ctx.beginPath();ctx.ellipse(cx,top,hw,ry,0,Math.PI,0,true);ctx.lineTo(cx+hw,bot);ctx.ellipse(cx,bot,hw,ry,0,0,Math.PI,false);ctx.closePath()};
 ctx.save();shape();const g=ctx.createLinearGradient(cx-hw,0,cx+hw,0);g.addColorStop(0,c.d);g.addColorStop(.3,c.b);g.addColorStop(.6,mix(c.b,.22));g.addColorStop(1,c.d);ctx.fillStyle=g;ctx.fill();ctx.clip();
 ctx.strokeStyle=c.d;ctx.globalAlpha=.3;ctx.lineWidth=Math.max(1.5,W*.006);for(let i=1;i<16;i++){const x=cx-hw+i*W/16;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bot+ry);ctx.stroke()}ctx.globalAlpha=1;
 ctx.strokeStyle=c.band;ctx.lineWidth=H*.13;for(const y of[top+H*.28,bot-H*.12]){ctx.beginPath();ctx.ellipse(cx,y,hw,ry,0,0,Math.PI);ctx.stroke()}
 ctx.restore();shape();ctx.strokeStyle=c.d;ctx.lineWidth=Math.max(2,W*.01);ctx.stroke();
 ctx.strokeStyle=c.band;ctx.lineWidth=H*.08;ctx.beginPath();ctx.ellipse(cx,top,hw,ry,0,0,Math.PI);ctx.stroke()}
function drawLid(ctx,cx,y,W,H,gold){const c=steamerCols(gold),ry=H*.22,lw=W*.53,dh=H*.85;
 const shape=()=>{ctx.beginPath();ctx.moveTo(cx-lw,y);ctx.bezierCurveTo(cx-lw,y-dh*.7,cx-lw*.45,y-dh,cx,y-dh);ctx.bezierCurveTo(cx+lw*.45,y-dh,cx+lw,y-dh*.7,cx+lw,y);ctx.ellipse(cx,y,lw,ry,0,0,Math.PI,false);ctx.closePath()};
 ctx.save();shape();const g=ctx.createLinearGradient(cx-lw,0,cx+lw,0);g.addColorStop(0,c.d);g.addColorStop(.35,mix(c.b,.25));g.addColorStop(.7,c.b);g.addColorStop(1,c.d);ctx.fillStyle=g;ctx.fill();
 ctx.save();ctx.clip();ctx.strokeStyle=c.d;ctx.globalAlpha=.25;ctx.lineWidth=Math.max(1.5,W*.007);for(let i=-14;i<=14;i++){const x=cx+i*lw*.12;ctx.beginPath();ctx.moveTo(x,y+ry);ctx.lineTo(x+dh*.7,y-dh);ctx.moveTo(x,y+ry);ctx.lineTo(x-dh*.7,y-dh);ctx.stroke()}ctx.restore();
 shape();ctx.strokeStyle=c.d;ctx.lineWidth=Math.max(2,W*.01);ctx.stroke();
 ctx.strokeStyle=c.band;ctx.lineWidth=H*.13;ctx.beginPath();ctx.ellipse(cx,y-H*.03,lw*.985,ry,0,0,Math.PI);ctx.stroke();
 rr(ctx,cx-W*.07,y-dh-H*.16,W*.14,H*.2,H*.08);ctx.fillStyle=c.band;ctx.fill();ctx.strokeStyle=c.d;ctx.lineWidth=Math.max(2,W*.01);ctx.stroke();
 ctx.restore()}
function rays(ctx,x,y,R,t,col){ctx.save();ctx.translate(x,y);ctx.rotate(t*.4);ctx.fillStyle=col;ctx.globalAlpha=.55;for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*Math.PI/6,i*Math.PI/6+Math.PI/14);ctx.closePath();ctx.fill()}ctx.restore()}

/* ---------- particles ---------- */
function burst(arr,x,y,kind,n,o={}){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.speed||300)*(.4+Math.random()*.8);arr.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||150),life:1,decay:.6+Math.random()*.6,kind,size:(o.size||14)*(.6+Math.random()*.8),c:o.colors?o.colors[i%o.colors.length]:'#fff',e:o.emoji,rot:Math.random()*6,vr:(Math.random()-.5)*8,g:o.g??600})}}

 ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.translate(p.x,p.y);
 if(p.kind==='steam'){ctx.fillStyle='rgba(255,255,255,.8)';circle(ctx,0,0,p.size*(1.6-p.life*.6));ctx.fill()}
 else{ctx.rotate(p.rot);
  if(p.kind==='conf'){ctx.fillStyle=p.c;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2)}

  else if(p.kind==='heart'){ctx.rotate(-p.rot);ctx.fillStyle=p.c;heartPath(ctx,0,0,p.size*1.6);ctx.fill()}
  else if(p.kind==='emoji')emoji(ctx,p.e,0,0,p.size)}

screens.steamer={phase:'closed',taps:0,wob:0,rise:0,d:null,isNew:false,sq:0,fx:[],golden:false,amb:0,lid:{x:0,y:0,r:0,vx:0,vy:0,vr:0},_g:null,_h:600,

  else if(this.phase==='open'&&this.rise>.9){const r=g.W*.3,dy=g.cy-g.H/2-.3*r;if(Math.hypot(p.x-g.cx,p.y-dy)<r*1.2){this.sq=1;SFX.squish();burst(this.fx,p.x,p.y,'heart',4,{colors:HEARTS,speed:200,g:-120,size:9})}}},

   ctx.fillStyle='rgba(40,60,30,.18)';ctx.beginPath();ctx.ellipse(m.x,m.y+.12*u,m.rx*1.05,m.ry*1.1,0,0,Math.PI*2);ctx.fill();

const LULLABY=[262,262,392,392,440,440,392,0,349,349,330,330,294,294,262,0,392,392,349,349,330,330,294,0,392,392,349,349,330,330,294,0,262,262,392,392,440,440,392,0,349,349,330,330,294,294,262,0];
screens.bed={state:'awake',fx:[],hopT:0,fade:0,lull:false,zT:0,stars:[],_g:null,
 enter(){this.state='awake';this.fx=[];this.hopT=0;this.fade=0;this.zT=0;this.stars=Array.from({length:45},()=>({x:Math.random(),y:Math.random()*.55,s:rand(1,2.6),ph:rand(0,6)}));$('#bedHint').hidden=false;
  setTimeout(()=>{if(cur==='bed'&&this.state==='awake')talk('sleepy')},500)},

 geom(w,h){const W=Math.min(w*.36,h*.5,380),H=W*.36;return{sx:w*.64,sy:h*.74,W,H,dx:w*.27,dy:h*.8,r:Math.min(w*.11,h*.15)}},

 lullaby(){if(this.lull)return;this.lull=true;let i=0,round=0;const step=()=>{if(!this.lull||cur!=='bed')return;const f=LULLABY[i];if(f)tone(f,1,{vol:.08});if(++i>=LULLABY.length){i=0;if(++round>=2){this.lull=false;return}}setTimeout(step,600)};setTimeout(step,800)},

  const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#12143A');sky.addColorStop(1,'#2E3275');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);

    if(this.fade>=1&&$('#sleep').hidden){$('#sleep').hidden=false;this.lull=false}}}
  drawFX(ctx,this.fx,dt);

let holdStart=0,holdRAF=0;
